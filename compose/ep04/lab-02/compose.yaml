# Authoring only: the learner path is three EC2 hosts (provided/ep04/lab-02/user-data.sh).
# Same layout as one EC2 host per node: each node runs a KRaft controller (ids 101-103)
# and a broker (ids 1-3) in separate containers, so a broker can die while the
# controller quorum stays whole. Clients on this machine use localhost:19094,29094,39094.
name: ep04-lab02
x-common: &common
  CLUSTER_ID: bGVkZ2VybGluZWxhYjAyIQ
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 101@ctrl-1:9093,102@ctrl-2:9093,103@ctrl-3:9093
  KAFKA_LOG_DIRS: /var/lib/kafka/data
x-controller: &controller
  image: apache/kafka:4.3.2
x-broker: &broker
  image: apache/kafka:4.3.2
  healthcheck:
    test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
    interval: 5s
    timeout: 10s
    retries: 36
x-broker-env: &broker-env
  <<: *common
  KAFKA_PROCESS_ROLES: broker
  KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_REPLICA_LAG_TIME_MAX_MS: 10000
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
x-controller-env: &controller-env
  <<: *common
  KAFKA_PROCESS_ROLES: controller
  KAFKA_LISTENERS: CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
services:
  ctrl-1: {<<: *controller, container_name: ep04-ctrl-1, hostname: ctrl-1, environment: {<<: *controller-env, KAFKA_NODE_ID: 101}}
  ctrl-2: {<<: *controller, container_name: ep04-ctrl-2, hostname: ctrl-2, environment: {<<: *controller-env, KAFKA_NODE_ID: 102}}
  ctrl-3: {<<: *controller, container_name: ep04-ctrl-3, hostname: ctrl-3, environment: {<<: *controller-env, KAFKA_NODE_ID: 103}}
  broker-1:
    <<: *broker
    container_name: ep04-broker-1
    hostname: broker-1
    ports: ["19094:9094"]
    environment: {<<: *broker-env, KAFKA_NODE_ID: 1, KAFKA_ADVERTISED_LISTENERS: "INTERNAL://broker-1:9092,EXTERNAL://localhost:19094"}
  broker-2:
    <<: *broker
    container_name: ep04-broker-2
    hostname: broker-2
    ports: ["29094:9094"]
    environment: {<<: *broker-env, KAFKA_NODE_ID: 2, KAFKA_ADVERTISED_LISTENERS: "INTERNAL://broker-2:9092,EXTERNAL://localhost:29094"}
  broker-3:
    <<: *broker
    container_name: ep04-broker-3
    hostname: broker-3
    ports: ["39094:9094"]
    environment: {<<: *broker-env, KAFKA_NODE_ID: 3, KAFKA_ADVERTISED_LISTENERS: "INTERNAL://broker-3:9092,EXTERNAL://localhost:39094"}
