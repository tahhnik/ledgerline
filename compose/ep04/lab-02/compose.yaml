# Three-node Kafka cluster in KRaft combined mode: each node is a broker and a controller.
# Clients on the VM use localhost:19092,29092,39092; the nodes talk to each other on the
# compose network (kafka-N:9092 for replication, kafka-N:9093 for the controller quorum).
name: ep04-lab02
x-kafka: &kafka
  image: apache/kafka:4.3.2
  environment: &env
    CLUSTER_ID: bGVkZ2VybGluZWxhYjAyIQ   # fixed so every learner gets the same cluster
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    # Lab-friendly timings: a stalled follower leaves the ISR after 10 s instead of 30 s.
    KAFKA_REPLICA_LAG_TIME_MAX_MS: 10000
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m"
  healthcheck:
    test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9094"]
    interval: 5s
    timeout: 10s
    retries: 36
services:
  kafka-1:
    <<: *kafka
    container_name: ep04-kafka-1
    hostname: kafka-1
    ports: ["19092:9094"]
    environment:
      <<: *env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092
    volumes: [kafka-1:/var/lib/kafka/data]
  kafka-2:
    <<: *kafka
    container_name: ep04-kafka-2
    hostname: kafka-2
    ports: ["29092:9094"]
    environment:
      <<: *env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:29092
    volumes: [kafka-2:/var/lib/kafka/data]
  kafka-3:
    <<: *kafka
    container_name: ep04-kafka-3
    hostname: kafka-3
    ports: ["39092:9094"]
    environment:
      <<: *env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:39092
    volumes: [kafka-3:/var/lib/kafka/data]
volumes:
  kafka-1:
  kafka-2:
  kafka-3:
